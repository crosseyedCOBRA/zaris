# ZarisWM example config file
# 
#
# =)

gaps_in=5
border_size=1
gaps_out=20
rounding=0
max_fps=60 # max fps for updates of config & animations
focus_when_hover=1 # 0 - do not switch the focus when hover (only for tiling)
main_mod=SUPER # For moving, resizing
intelligent_transients=1 # keeps transients always on top.
no_unmap_saving=1 # disables saving unmapped windows (seems to break sometimes)
scratchpad_mon=0 # self-explanatory

# Cursor theme/size - the one place to set these; start-zaris.sh reads
# this file for these two lines specifically (before Zaris itself starts)
# and propagates them everywhere X11 apps actually look for a cursor
# theme - the WM's own root cursor, GTK3/GTK4 apps, Qt apps, and any
# plain Xlib/XCB app - so every toolkit agrees instead of each one
# showing whatever it last picked up independently. See
# shell/zaris/apply-cursor-theme.sh for exactly what it touches. "Adwaita"
# ships in the base xcursor-themes package on effectively every distro -
# a safe default that isn't specific to any one theme pack a fresh
# install might not have; run `ls /usr/share/icons/` to see what's
# actually installed and pick a real one.
cursor_theme=Adwaita
cursor_size=24

# Execs
# exec-once=/home/me/MyEpicShellScript # will exec the script only when the WM launches
# exec=/home/me/MyEpicShellScript # will exec the script every time the config is reloaded

# Audio: NOT a harmless no-op on a systemd system, despite what this
# comment used to claim - confirmed live (real bug, real audio outage,
# not theoretical): launching these directly races systemd's own
# pipewire.socket/pipewire-pulse.socket activation for the same runtime
# sockets, and repeating that race across a few logins is enough to trip
# systemd's start-limit and leave the sockets permanently refusing
# activation until manually reset (systemctl --user reset-failed).
# `command -v systemctl` gates each line: on a systemd system, skip
# entirely and trust the already-enabled socket-activated units; on
# OpenRC/runit/etc. with no systemd at all, launch directly same as
# before, since nothing else would ever start them.
exec-once=sh -c 'command -v systemctl >/dev/null 2>&1 || exec pipewire'
exec-once=sh -c 'command -v systemctl >/dev/null 2>&1 || exec pipewire-pulse'
exec-once=sh -c 'command -v systemctl >/dev/null 2>&1 || exec wireplumber'

# Compositor: Zaris does no compositing itself (see ROADMAP.md). picom
# recommended for real alpha blending, rounded-corner anti-aliasing,
# shadows, and background blur - see shell/zaris/picom.conf for a starter
# config, or drop the line below if you'd rather run without one.
exec-once=picom

exec-once=qs -d # starts the Quickshell shell (launcher, and later the bar) daemonized

# Layout
layout=0 # 0 - dwindle (default), 1 - master
layout {
    no_gaps_when_only=0 # disables gaps and borders when only window on screen
}

# colors
col.active_border=0x77ff3333
col.inactive_border=0x77222222

# status command
# deprecated
# status_command=date +%a,\ %b\ %Y\ \ %I:%M\ %p
#

# animations
Animations {
    enabled=1 # For windows
    window_resize_speed=20 # This is for windows resizing
    workspaces=1 # For workspace animations (fixed, enabling by default)
    speed=20 # This is for workspaces
    cheap=1 # highly recommended
    borders=0
}

# example window rules, more in the wiki

# windowrule=float,class:krunner
# windowrule=float,role:pop-up
# windowrule=float,role:task_dialog
# windowrule=monitor 0,class:krunner
# windowrule=size 500 50,class:krunner
# windowrule=move 700 500,class:krunner
# windowrule=pseudo,class:discord

# Games: force fullscreen instead of tiling. Steam sets WM_CLASS to
# steam_app_<appid> for any game it launches (native or Proton/Wine) -
# confirmed live via xprop on No Man's Sky (steam_app_275850) - so this one
# rule covers your whole Steam library, not just one game. A game launched
# some other way (Lutris, Heroic, running the binary directly) won't match
# this and needs its own rule for its actual WM_CLASS (check with xprop).
windowrule=fullscreen,class:^steam_app_.*$

# Quickshell launcher: force floating, since its X11 window carries no hint
# that would otherwise keep it out of the tiling tree. Quickshell's
# FloatingWindow never sets WM_CLASS at all (confirmed via xprop - class:
# rules can never match it), but it does set a WM_NAME of "Launcher", so we
# match on title instead. It's a plain _NET_WM_WINDOW_TYPE_NORMAL window (not
# a dialog/modal/etc.), so it doesn't get auto-centered like those do -
# center it explicitly instead.
windowrule=float,title:^Launcher$
windowrule=center,title:^Launcher$

# keybinds
bind=SUPER,SPACE,exec,qs ipc call launcher toggle
bind=SUPER,Q,killactive,
bind=SUPER,RETURN,exec,kitty
bind=SUPER,G,exec,google-chrome-stable

bind=SUPER,LEFT,movewindow,l
bind=SUPER,RIGHT,movewindow,r
bind=SUPER,UP,movewindow,u
bind=SUPER,DOWN,movewindow,d

bind=SUPER,LEFT,movefocus,l
bind=SUPER,RIGHT,movefocus,r
bind=SUPER,UP,movefocus,u
bind=SUPER,DOWN,movefocus,d

bind=SUPER,F,fullscreen,

bind=SUPER,1,workspace,1
bind=SUPER,2,workspace,2
bind=SUPER,3,workspace,3
bind=SUPER,4,workspace,4
bind=SUPER,5,workspace,5
bind=SUPER,6,workspace,6
bind=SUPER,7,workspace,7
bind=SUPER,8,workspace,8
bind=SUPER,9,workspace,9

bind=SUPERSHIFT,1,movetoworkspace,1
bind=SUPERSHIFT,2,movetoworkspace,2
bind=SUPERSHIFT,3,movetoworkspace,3
bind=SUPERSHIFT,4,movetoworkspace,4
bind=SUPERSHIFT,5,movetoworkspace,5
bind=SUPERSHIFT,6,movetoworkspace,6
bind=SUPERSHIFT,7,movetoworkspace,7
bind=SUPERSHIFT,8,movetoworkspace,8
bind=SUPERSHIFT,9,movetoworkspace,9

bind=SUPERSHIFT,S,movetoworkspace,scratchpad
bind=SUPER,S,scratchpad,

bind=SUPERSHIFT,SPACE,togglefloating,

bind=SUPER,equal,splitratio,+
bind=SUPER,minus,splitratio,-
