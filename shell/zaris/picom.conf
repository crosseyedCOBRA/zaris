# picom config for ZarisWM's reference shell.
#
# Zaris itself does no compositing of its own (see ROADMAP.md's "Bundled
# compositor removed in favor of picom" entry) - it just avoids claiming
# _NET_WM_CM_S0 or redirecting subwindows, so any compositor is free to run.
# This is the recommended one, tuned to roughly match what the old built-in
# compositor did: rounded corners, drop shadows, and background blur behind
# the Bar/Control Center/Settings/calendar flyout's translucent panels.
#
# corner-radius here is independent of zaris.conf's own `rounding` (that one
# drives the X SHAPE clip Zaris itself applies) - keep the two in sync by
# hand if you change one.

backend = "glx";
vsync = true;

corner-radius = 10;
rounded-corners-exclude = [
    "window_type = 'dock'",
];

shadow = true;
shadow-radius = 16;
shadow-opacity = 0.45;
shadow-exclude = [
    "window_type = 'dock'",
];

blur-method = "dual_kawase";
blur-strength = 5;
blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
];

# Quickshell's Bar/Control Center/Settings already carry real (premultiplied)
# alpha in their own drawing - this just needs to blend it, not add extra
# opacity on top. Leave `opacity-rule` alone unless you want to dim/fade
# something further yourself.

fading = false;
